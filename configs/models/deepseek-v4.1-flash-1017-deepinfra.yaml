# Model profile: DeepSeek V4.1 Flash, snapshot 1017, through OpenRouter, pinned to DeepInfra FP8
# (no fallback to other providers). The user's choice (2026-10-22), after OpenRouter retired the
# free MiniMax M3.1 Flash: try this model and provider, small test first. DeepInfra FP8 list price
# on 2026-10-22: $0.098/M input, $0.294/M output, $0.003/M cached input.
id: deepseek-v4.1-flash-1017-deepinfra
title: DeepSeek V4.1 Flash 1017 (DeepInfra FP8)
config_dir: api
local_runs: runs/api
run_prefix: dsv41flash1017_deepinfrafp8_low
bench_concurrency: 8
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 8  # small test first (the user's request, 2026-10-22)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
# Exam pilot only (2026-10-09, the user's choice): unprompted games only (no INST), as for
# GPT-6.1 Sol. The other setups keep both conditions.
setup_module_override:
  shared_audit_3:
    instructed: false
  shared_audit_3_dw:
    instructed: false
  shared_audit_3_dw_nh:
    instructed: false
  shared_audit:
    instructed: false
  ring_audit_6:
    instructed: false
  ring_audit:
    instructed: false
  exam:
    instructed: false
  exam_split:
    instructed: false
  exam_split_comms:
    instructed: false
  exam_split_both:
    instructed: false
  records:
    instructed: false
  school_ops:
    instructed: false
  records_per_agent:
    instructed: false
  dept_audit:
    instructed: false
  school_ops_per_agent:
    instructed: false
# Exam pilot: all 18 model games at once (scripted reference games are quick).
setup_run_override:
  shared_audit_3:
    concurrency: 54
  shared_audit_3_dw:
    concurrency: 54
  shared_audit_3_dw_nh:
    concurrency: 54
  shared_audit:
    concurrency: 54
  ring_audit_6:
    concurrency: 54
  ring_audit:
    concurrency: 54
  exam:
    concurrency: 54
  exam_split:
    concurrency: 54
  exam_split_comms:
    concurrency: 54
  exam_split_both:
    concurrency: 54
  records:
    concurrency: 54
  school_ops:
    concurrency: 54
  records_per_agent:
    concurrency: 54
  dept_audit:
    concurrency: 54
  school_ops_per_agent:
    concurrency: 54
model:
  name: deepseek-v4.1-flash-1017-deepinfrafp8-low
  tag: openrouter-deepinfra-fp8
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: deepseek/deepseek-v4.1-flash-1017
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - deepinfra/fp8
        allow_fallbacks: false
