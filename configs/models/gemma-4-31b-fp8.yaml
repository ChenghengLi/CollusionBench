# Model profile: Google Gemma 4 31B instruction model (google/gemma-4-31B-it), a non-K2 comparison
# model (2026-10-25). Google ships no FP8 build, so the official BF16 weights are quantized to FP8
# by vLLM at load. Served on RCP by serving/rcp/submit.sh (MODEL=gemma31, one H100) with the
# parsers and tool chat template from vLLM's Gemma 4 recipe (gemma4 / gemma4).
# Sampling: temperature 1.0, top-p 0.95, 8,192 tokens like every other run; top_k 64 is Google's
# generation_config. Gemma 4 has no effort levels, only thinking on/off; thinking is on, as the
# other models in the benchmark all reason before acting.
id: gemma-4-31b-fp8
title: Gemma 4 31B FP8
config_dir: rcpgemma31
local_runs: runs/rcp
run_prefix: gemma431b_rcp
bench_concurrency: 20  # four card games share one H100 (job n4t, all scenarios)
run:
  output_dir: runs
  seed: 2026
  concurrency: 20
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
model:
  name: gemma-4-31b-it-fp8
  tag: official BF16 (google/gemma-4-31B-it), FP8 quantized by vLLM at load
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: gemma-4-31b-it-fp8
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      top_k: 64
      chat_template_kwargs:
        enable_thinking: true
