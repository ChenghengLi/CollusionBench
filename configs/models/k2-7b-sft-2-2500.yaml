# Model profile: K2-Horizon-7B intermediate checkpoint sft_2_2500 (IFM/K2-Horizon-7B, branch sft_2_2500, commit 6b1b2dde83be).
# SFT phase 2 final: the checkpoint the anti-doom-loop (FTPO) stage starts from.
# Part of the card-benchmark checkpoint sweep the user picked on 2026-10-24 (training order: pretrain ->
# mid 1-4 -> RL experts -> RL merge -> SFT 1 -> SFT 2 -> anti-doom-loop = final). Same serving and sampling as
# the final 7B (configs/models/k2-7b.yaml); served by serving/rcp/submit.sh MODEL=7bckpt CKPT_TAG=sft_2_2500.
id: k2-7b-sft-2-2500
title: K2-Horizon-7B sft_2_2500
config_dir: rcp7b_sft_2_2500
local_runs: runs/rcp
run_prefix: ckpt7b_sft2_rcp
bench_concurrency: 20  # four card games share one H100 (job n4t, all scenarios)
run:
  output_dir: runs
  seed: 2026
  concurrency: 48
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
model:
  name: k2h-7b@sft_2_2500
  tag: sft_2_2500
  stage: sft
  revision: 6b1b2dde83bef1fef4e71289b9a5a2f1001bb350
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: k2h-7b@sft_2_2500
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      chat_template_kwargs:
        reasoning_effort: low
