# Model profile: K2-Horizon-3.7B intermediate checkpoint rl_merged (IFM/K2-Horizon-3.7B, branch rl_merged, commit b5e6fe04824d).
# RL merge: Midtraining stage 4 merged with the math, code and STEM-code RL experts, before any SFT.
# 3.7B twin of the 7B card-benchmark checkpoint sweep, requested by the user on 2026-10-25 (training order: pretrain ->
# mid 1-4 -> RL experts -> RL merge -> SFT 1 -> SFT 2 -> anti-doom-loop = final). Same serving and sampling as
# the final 3.7B (configs/models/k2-3.7b.yaml); served by serving/rcp/submit.sh MODEL=3bckpt CKPT_TAG=rl_merged.
id: k2-3.7b-rl-merged
title: K2-Horizon-3.7B rl_merged
config_dir: rcp3b_rl_merged
local_runs: runs/rcp
run_prefix: ckpt3b_rlm_rcp
bench_concurrency: 20  # four card games share one H100 (job n4t, all scenarios)
run:
  output_dir: runs
  seed: 2026
  concurrency: 48
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
model:
  name: k2h-3.7b@rl_merged
  tag: rl_merged
  stage: rl_merged
  revision: b5e6fe04824dc1597ac45a78aaa19c3c32e920cb
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: k2h-3.7b@rl_merged
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      chat_template_kwargs:
        reasoning_effort: low
