# Model profile: Meta Muse Spark 1.3 Contributor through OpenRouter, pinned to Meta's own endpoint
# (no fallback), running only the first tool call of each reply. The same setup as MiMo and
# GLM-5.3-Flash on wafer: low reasoning, message caps 1/3/5/7/9, one round of every game.
# Configs go to configs/api/muse-spark-1.3-contributor/.
# Needs the OpenRouter account's 18+ confirmation (settings/preferences) before any request.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
id: muse-spark-1.3-contributor
title: Muse Spark 1.3 Contributor (Meta, one call per reply)
config_dir: api
local_runs: runs/api
run_prefix: musespark13c_meta_low_cap1
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # six configs share 2 × 64: about 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
  # Message caps 1, 3, 5, 7 and 9 only, as for MiMo and GLM: the even caps are left out.
  skip_params:
    max_messages: [2, 4, 6, 8, 10]
model:
  name: muse-spark-1.3-contributor-meta-low-cap1
  tag: openrouter-meta
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: meta/muse-spark-1.3-contributor
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  max_calls_per_reply: 1  # only the first tool call of a reply runs, as for MiMo and GLM
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - meta
        allow_fallbacks: false
