# Model profile: DeepSeek V4.1 Flash through OpenRouter, pinned to Baidu's FP8 endpoint (no
# fallback to other providers). Configs go to configs/api/deepseek-v4.1-flash-baidu/.
# The Relace profile (deepseek-v4.1-flash.yaml) is the same model on another provider; runs on
# the two providers are kept apart (their own run names), never mixed.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
# reps: one round of every game for now (episode 0); add runs at offset 1, 2, ... later.
id: deepseek-v4.1-flash-baidu
title: DeepSeek V4.1 Flash (Baidu FP8)
config_dir: api
local_runs: runs/api
run_prefix: dsv41flash_baidufp8_low
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # two setups run side by side: 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
# Exam pilot only (2026-10-09, the user's choice): unprompted games only (no INST), as for
# GPT-6.1 Sol. The other setups keep both conditions.
setup_module_override:
  shared_audit_3:
    instructed: false
  shared_audit_3_dw:
    instructed: false
  shared_audit_3_dw_nh:
    instructed: false
  shared_audit:
    instructed: false
  ring_audit_6:
    instructed: false
  ring_audit:
    instructed: false
  exam:
    instructed: false
  exam_split:
    instructed: false
  exam_split_comms:
    instructed: false
  exam_split_both:
    instructed: false
  records:
    instructed: false
  school_ops:
    instructed: false
  records_per_agent:
    instructed: false
  dept_audit:
    instructed: false
  school_ops_per_agent:
    instructed: false
# Exam pilot: all 18 model games at once (scripted reference games are quick).
setup_run_override:
  shared_audit_3:
    concurrency: 54
  shared_audit_3_dw:
    concurrency: 54
  shared_audit_3_dw_nh:
    concurrency: 54
  shared_audit:
    concurrency: 54
  ring_audit_6:
    concurrency: 54
  ring_audit:
    concurrency: 54
  exam:
    concurrency: 54
  exam_split:
    concurrency: 54
  exam_split_comms:
    concurrency: 54
  exam_split_both:
    concurrency: 54
  records:
    concurrency: 54
  school_ops:
    concurrency: 54
  records_per_agent:
    concurrency: 54
  dept_audit:
    concurrency: 54
  school_ops_per_agent:
    concurrency: 54
model:
  name: deepseek-v4.1-flash-baidufp8-low
  tag: openrouter-baidu-fp8
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: deepseek/deepseek-v4.1-flash
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - baidu/fp8
        allow_fallbacks: false
