# Model profile: OpenAI GPT-6 Luna through OpenRouter, pinned to OpenAI's flex tier (openai/flex,
# no fallback), running only the first tool call of each reply. The same setup as MiMo and
# GLM-5.3-Flash on wafer: low reasoning, message caps 1/3/5/7/9, one round of every game.
# Configs go to configs/api/gpt-6-luna-flex/.
# OpenAI returns its reasoning encrypted; summary "detailed" adds a readable summary of it, which
# is what the transcripts show as reasoning (a summary, not the raw reasoning). The endpoint does
# not take temperature or top_p, so OpenRouter drops them.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
id: gpt-6-luna-flex
title: GPT-6 Luna (OpenAI flex, one call per reply)
config_dir: api
local_runs: runs/api
run_prefix: gpt6luna_flex_low_cap1
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # six configs share 2 × 64: about 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
  # Message caps 1, 3, 5, 7 and 9 only, as for MiMo and GLM: the even caps are left out.
  skip_params:
    max_messages: [2, 4, 6, 8, 10]
# Two-way ring audit, 6 agents (ring_audit_6, 2026-10-10): unprompted, as for DeepSeek.
setup_module_override:
  shared_audit_3:
    instructed: false
  shared_audit_3_dw:
    instructed: false
  shared_audit_3_dw_nh:
    instructed: false
  shared_audit:
    instructed: false
  ring_audit_6:
    instructed: false
setup_run_override:
  shared_audit_3:
    concurrency: 54
  shared_audit_3_dw:
    concurrency: 54
  shared_audit_3_dw_nh:
    concurrency: 54
  shared_audit:
    concurrency: 54
  ring_audit_6:
    concurrency: 54
model:
  name: gpt-6-luna-flex-low-cap1
  tag: openrouter-openai-flex
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: openai/gpt-6-luna
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  max_calls_per_reply: 1  # only the first tool call of a reply runs, as for MiMo and GLM
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
        summary: detailed
      provider:
        only:
        - openai/flex
        allow_fallbacks: false
