# Model profile: Qwen3.6-35B-A3B, Qwen's official FP8 build (Qwen/Qwen3.6-35B-A3B-FP8, Apache-2.0), a
# mixture-of-experts model (35B total, ~3B active; 256 experts, 8 per token) of the same architecture
# family as Qwen3.8-27B (2026-11-18: candidate for the RL organism, faster rollouts). Served on RCP by
# serving/rcp/submit.sh (MODEL=qwen36moe, one H100) with the parsers from its model card (reasoning
# qwen3, tools qwen3_coder).
# Sampling matches the Qwen3.8 runs (temperature 1.0, top-p 0.95, top_k 20, 8,192 tokens). This model's
# chat template has no reasoning-effort control (thinking is on by default), so no reasoning_effort is
# sent; the card's presence_penalty 1.5 is not used, as in the Qwen3.8 runs.
id: qwen3.6-35b-a3b-fp8
title: Qwen3.6-35B-A3B FP8
config_dir: rcpqwen36moe
local_runs: runs/rcp
run_prefix: qwen36moe_rcp
bench_concurrency: 24
run:
  output_dir: runs
  seed: 2026
  concurrency: 24
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
model:
  name: qwen3.6-35b-a3b-fp8
  tag: official FP8 (Qwen/Qwen3.6-35B-A3B-FP8)
  revision: c653bba46dfa06e9658dcc0b0dc87fe4685f14a2
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: qwen3.6-35b-a3b-fp8
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      top_k: 20
