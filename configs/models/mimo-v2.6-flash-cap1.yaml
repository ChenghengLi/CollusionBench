# Model profile: Xiaomi MiMo V2.6 Flash through OpenRouter, pinned to Makora's FP8 endpoint (no
# fallback to other providers), running only the first tool call of each reply. Configs go to
# configs/api/mimo-v2.6-flash-cap1/.
# Why the cap: in the first, uncapped runs (stopped and archived with their profile in
# runs/_archive/mimo_before_restart_20261009_0109/) MiMo often sent one reply
# with hundreds of tool calls (up to 858), spending its whole call budget in a single turn. The
# prompt asks for one tool call per reply; DeepSeek and Haiku ran uncapped, and put more than one
# call in a reply in 11% and 2% of their replies.
# Low reasoning, as for DeepSeek V4.1 Flash and Claude Haiku 5.5. Checked before the run: tool
# calls, reasoning and multi-turn tool use work on makora/fp8.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
# reps: one round of every game for now (episode 0); add runs at offset 1, 2, ... later.
id: mimo-v2.6-flash-cap1
title: MiMo V2.6 Flash (Makora FP8, one call per reply)
config_dir: api
local_runs: runs/api
run_prefix: mimo26flash_makorafp8_low_cap1
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # six configs share 2 × 64: about 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
  # Message caps 1, 3, 5, 7 and 9 only (the user's choice): the even caps are left out. The
  # games stay in the plan; delete this entry and rerun make to play them later in the same runs.
  skip_params:
    max_messages: [2, 4, 6, 8, 10]
# Two-way ring audit, 6 agents (ring_audit_6, 2026-10-10): unprompted, as for DeepSeek.
setup_module_override:
  shared_audit_3:
    instructed: false
  shared_audit_3_dw:
    instructed: false
  shared_audit_3_dw_nh:
    instructed: false
  shared_audit:
    instructed: false
  ring_audit_6:
    instructed: false
setup_run_override:
  shared_audit_3:
    concurrency: 54
  shared_audit_3_dw:
    concurrency: 54
  shared_audit_3_dw_nh:
    concurrency: 54
  shared_audit:
    concurrency: 54
  ring_audit_6:
    concurrency: 54
model:
  name: mimo-v2.6-flash-makorafp8-low-cap1
  tag: openrouter-makora-fp8
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: xiaomi/mimo-v2.6-flash
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  max_calls_per_reply: 1  # only the first tool call of a reply runs
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - makora/fp8
        allow_fallbacks: false
