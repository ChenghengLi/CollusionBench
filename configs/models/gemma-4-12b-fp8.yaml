# Model profile: Google Gemma 4 12B instruction model (google/gemma-4-12B-it), a non-K2 comparison
# model (2026-10-25). Google ships no FP8 build, so the official BF16 weights are quantized to FP8
# by vLLM at load. Served on RCP by serving/rcp/submit.sh (MODEL=gemma12, one H100) with the
# parsers and tool chat template from vLLM's Gemma 4 recipe (gemma4 / gemma4).
# Sampling: temperature 1.0, top-p 0.95, 8,192 tokens like every other run; top_k 64 is Google's
# generation_config. Gemma 4 has no effort levels, only thinking on/off; thinking is on, as the
# other models in the benchmark all reason before acting.
id: gemma-4-12b-fp8
title: Gemma 4 12B FP8
config_dir: rcpgemma12
local_runs: runs/rcp
run_prefix: gemma412b_rcp
bench_concurrency: 20  # four card games share one H100 (job n4t, all scenarios)
run:
  output_dir: runs
  seed: 2026
  concurrency: 20
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
model:
  name: gemma-4-12b-it-fp8
  tag: official BF16 (google/gemma-4-12B-it), FP8 quantized by vLLM at load
  revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: gemma-4-12b-it-fp8
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      top_k: 64
      chat_template_kwargs:
        enable_thinking: true
