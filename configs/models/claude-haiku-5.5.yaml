# Model profile: Claude Haiku 5.5 through OpenRouter, pinned to Google Vertex (global endpoint),
# no fallback to other providers. Configs go to configs/api/claude-haiku-5.5/.
# Low reasoning: OpenRouter turns reasoning.effort into Anthropic's thinking budget. The endpoint
# does not list temperature or top_p among its supported parameters, so OpenRouter drops them;
# they stay here only so every profile has the same sampling block.
# Past reasoning is not sent back with the history (as for every model); checked that Haiku with
# thinking accepts this on multi-turn tool use.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
# reps: one round of every game for now (episode 0); add runs at offset 1, 2, ... later.
id: claude-haiku-5.5
title: Claude Haiku 5.5 (Google Vertex)
config_dir: api
local_runs: runs/api
run_prefix: haiku55_gvertex_low
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # six configs share 2 × 64: about 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
  # Message caps 7-10 left out for now (the user's choice, to save cost). The games stay in the
  # plan; delete this entry and rerun make to play them later in the same runs.
  skip_params:
    max_messages: [7, 8, 9, 10]
model:
  name: claude-haiku-5.5-gvertex-low
  tag: openrouter-google-vertex-global
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: anthropic/claude-haiku-5.5
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - google-vertex/global
        allow_fallbacks: false
