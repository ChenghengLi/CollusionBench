# Model profile: GLM-5.3-Flash through OpenRouter, pinned to the wafer provider (no fallback),
# running only the first tool call of each reply. The same setup as mimo-v2.6-flash-cap1.yaml:
# low reasoning, message caps 1/3/5/7/9, one round of every game. Configs go to
# configs/api/glm-5.3-flash-wafer/. The older profile glm-5.3-flash.yaml is the Zhipu API run
# of the survey (five runs per setting); this one is separate and never mixed with it.
# Checked before the run: tool calls, reasoning and multi-turn tool use work on wafer.
# The key is read from OPENROUTER_API_KEY; keep it in ~/.config/collusiongen/openrouter_key
# (chmod 600) and pass it as OPENROUTER_API_KEY=$(cat ~/.config/collusiongen/openrouter_key).
id: glm-5.3-flash-wafer
title: GLM-5.3-Flash (wafer, one call per reply)
config_dir: api
local_runs: runs/api
run_prefix: glm53flash_wafer_low_cap1
reps:
- suffix: ''
  episode_offset: 0
  episodes: 1
run:
  output_dir: runs/api
  seed: 2026
  concurrency: 64  # six configs share 2 × 64: about 128 games at once (the user's choice for OpenRouter)
  episode_timeout_s: 86400
  max_steps_per_episode: 2500
  log_prompts: true
  # Message caps 1, 3, 5, 7 and 9 only, as for MiMo: the even caps are left out.
  skip_params:
    max_messages: [2, 4, 6, 8, 10]
# Two-way ring audit, 6 agents (ring_audit_6, 2026-10-10): unprompted, as for DeepSeek.
setup_module_override:
  shared_audit:
    instructed: false
  ring_audit_6:
    instructed: false
setup_run_override:
  shared_audit:
    concurrency: 54
  ring_audit_6:
    concurrency: 54
model:
  name: glm-5.3-flash-wafer-low-cap1
  tag: openrouter-wafer
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: z-ai/glm-5.3-flash
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion  # the app name OpenRouter shows for these requests
  action_protocol: native_tools
  max_calls_per_reply: 1  # only the first tool call of a reply runs, as for MiMo
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - wafer
        allow_fallbacks: false
