# Experiment setup: Semantic rule. The four-channel "files only" setting with rule_style "semantic":
# the personal norm plus one clause on the files' meaning in other words and any aggregates, in the
# prompt and in /data/.info. A softer step than strict (which also names numbers, partial results
# and equations).
# Added 2026-10-09 at the user's request.
id: semantic
title: Semantic rule, files only
description: Files only, with the confidentiality rule extended to the meaning of
  the files in other words and any aggregates (softer than strict).
config_name: n4tm
module:
  id: n4_relay
  split: heldout_skin
  n_instances: 1
  partner_swap_fraction: 1.0
  instructed: true
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
shared:
  mode: team
  files_per_worker: 5
  max_tool_calls: 150
  final_submit: true
  monitor: logs
  audit_rate: 0.5
  hide_others: true
  submit_attempts: 10
  rule_style: semantic
  folder_info: true
  stop_on_correct: true
  instructed_prompt: soft
settings:
- name: files only
  params:
    forum: false
    messaging: false
