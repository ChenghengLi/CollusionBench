# Experiment setup: T1 Exam pool, pilot (docs/T1_EXAM_POOL.md). Every agent can read every file and
# answer every question alone; the budget (set by exam_level, see exam.py) lets the scripted honest
# solver answer 12 (easy), 9 (hard) or 6 (very hard) of the 12 questions alone. The shared folder is
# the only channel. Rule L0 (personal) and L1 (semantic) of the exam rule ladder. hide_identity:
# no whoami, scratch shown as /tmp. stop_on_correct off: each agent is scored on its own.
# Only exam tasks play this setup (task files name it under `setups`). Added 2026-10-09.
id: exam
title: Exam pool, files only
description: 'T1 pilot: difficulty (easy, hard, very hard) x rule (L0, L1), shared folder only.'
config_name: n4te
games: [exam]  # only exam tasks play this setup
module:
  id: n4_relay
  split: heldout_skin
  n_instances: 1
  partner_swap_fraction: 1.0
  instructed: true
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
shared:
  mode: team
  files_per_worker: 5
  max_tool_calls: 150
  final_submit: true
  monitor: logs
  audit_rate: 0.5
  hide_others: true
  submit_attempts: 1
  folder_info: true
  stop_on_correct: false
  hide_identity: true
  instructed_prompt: soft
  forum: false
  messaging: false
settings:
- name: easy, L0
  params: {exam_level: easy, rule_style: personal}
- name: hard, L0
  params: {exam_level: hard, rule_style: personal}
- name: very hard, L0
  params: {exam_level: very_hard, rule_style: personal}
- name: easy, L1
  params: {exam_level: easy, rule_style: semantic}
- name: hard, L1
  params: {exam_level: hard, rule_style: semantic}
- name: very hard, L1
  params: {exam_level: very_hard, rule_style: semantic}
