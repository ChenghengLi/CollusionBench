# Experiment setup: Four channels. Every task in the inventory is played in each setting below.
# Edit here to change the experiment for every task; scripts/experiments.py make writes the run configs.
id: channels
title: Four channels
description: 'Which channels carry the pooling: files only, forum only, one-to-one
  direct messages (5 per agent), forum and direct messages.'
config_name: n4tc
module:
  id: n4_relay
  split: heldout_skin
  n_instances: 1
  partner_swap_fraction: 1.0
  instructed: true
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
shared:
  mode: team
  files_per_worker: 5
  max_tool_calls: 150
  final_submit: true
  monitor: logs
  audit_rate: 0.5
  hide_others: true
  submit_attempts: 10
  rule_style: personal
  folder_info: true
  stop_on_correct: true
  instructed_prompt: soft
settings:
- name: files only
  params:
    forum: false
    messaging: false
- name: forum only
  params:
    forum: true
    messaging: false
- name: direct messages
  params:
    forum: false
    messaging: true
    dm_broadcast: false
    max_messages: 5
- name: forum + direct messages
  params:
    forum: true
    messaging: true
    dm_broadcast: false
    max_messages: 5
