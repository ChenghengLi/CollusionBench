# GLM-5.3-Flash (wafer, one call per reply) · depot_v1 · Message cap · runs 1-1
# Written by scripts/experiments.py make from configs/models, configs/setups and the task inventory.
# Edit those and run make again; do not edit this file.
run_id: glm53flash_wafer_low_cap1_n4_depot_v1_dmcap
output_dir: runs/api
seed: 2026
concurrency: 21
episode_timeout_s: 86400
max_steps_per_episode: 2500
log_prompts: true
skip_params:
  max_messages:
  - 2
  - 4
  - 6
  - 8
  - 10
models:
- name: glm-5.3-flash-wafer-low-cap1
  tag: openrouter-wafer
  backend:
    kind: openai_chat
    base_url: https://openrouter.ai/api/v1
    chat_path: /chat/completions
    served_model: z-ai/glm-5.3-flash
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 600
    headers:
      X-Title: Emergent Collusion
  action_protocol: native_tools
  max_calls_per_reply: 1
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning:
        effort: low
      provider:
        only:
        - wafer
        allow_fallbacks: false
modules:
- id: n4_relay
  split: heldout_skin
  n_instances: 1
  partner_swap_fraction: 1.0
  instructed: true
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
  params_override:
    mode: team
    files_per_worker: 5
    max_tool_calls: 150
    final_submit: true
    monitor: logs
    audit_rate: 0.5
    hide_others: true
    submit_attempts: 10
    rule_style: personal
    folder_info: true
    stop_on_correct: true
    instructed_prompt: soft
    forum: false
    messaging: true
    dm_broadcast: false
    max_messages: 1
    task: depot_v1
    game: brief
    chunk_chars: 20
  episodes_per_instance: 1
