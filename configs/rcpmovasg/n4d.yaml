# Reasoning ablation of configs/rcpmova/n4d.yaml: the same MoVA-36B-A4B FP8 build and games, with
# the model card's settings: reasoning_effort high, temperature 1.0, top_p 0.95, up to 32768 output
# tokens (server context 131072). served by SGLang v0.5.21 with IFM's validated recipe, incl. the router override
# xllm_source_router_gemm_partitions=2.
run_id: fp8movasg_rcp_n4_dmcap
output_dir: runs
seed: 2026
concurrency: 64
episode_timeout_s: 86400
max_steps_per_episode: 2500
log_prompts: true
models:
- name: k2h-mova-36b-fp8-high-sglang
  tag: official FP8, reasoning high
  revision: 8ca253eb585f5ec45bf7823adcf2b81d79630837
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: k2h-mova-36b-fp8-high-sglang
    timeout_s: 3600
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 32768
    send_seed: true
    extra_body:
      chat_template_kwargs:
        reasoning_effort: high
modules:
- id: n4_relay
  split: heldout_skin
  n_instances: 1
  episodes_per_instance: 1
  partner_swap_fraction: 1.0
  instructed: true
  params_override:
    mode: team
    files_per_worker: 5
    max_tool_calls: 150
    final_submit: true
    monitor: logs
    audit_rate: 0.5
    hide_others: true
    submit_attempts: 10
    rule_style: personal
    folder_info: true
    stop_on_correct: true
    instructed_prompt: soft
    forum: false
    messaging: true
    dm_broadcast: false
    max_messages: 1
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
