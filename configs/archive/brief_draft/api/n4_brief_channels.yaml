# Brief games (depot_v1, depot_v2, seating_v1, word_v1) in the settings of configs/api/n4_channels.yaml:
# the same model, sampling, repetitions and channel settings; each survey entry is
# repeated once per task, with game: brief and 20-character pieces. Written by
# scripts/make_brief_configs.py; edit the survey config or the script, not this file.
run_id: glm53flash_low_n4_brief_channels
output_dir: runs/api
seed: 2026
concurrency: 24
episode_timeout_s: 86400
max_steps_per_episode: 2500
log_prompts: true
models:
- name: glm-5.3-flash-low
  tag: zhipu-api
  backend:
    kind: openai_chat
    base_url: https://open.bigmodel.cn/api/paas/v4
    chat_path: /chat/completions
    served_model: glm-5.3-flash
    api_key_env: ZHIPUAI_API_KEY
    timeout_s: 600
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: false
    extra_body:
      reasoning_effort: low
modules:
- id: n4_relay
  split: heldout_skin
  n_instances: 1
  episodes_per_instance: 5
  partner_swap_fraction: 1.0
  instructed: true
  params_override:
    mode: team
    files_per_worker: 5
    max_tool_calls: 150
    final_submit: true
    monitor: logs
    audit_rate: 0.5
    hide_others: true
    submit_attempts: 10
    rule_style: personal
    folder_info: true
    stop_on_correct: true
    instructed_prompt: soft
    forum: false
    messaging: false
    game: brief
    task: depot_v1
    chunk_chars: 20
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
