# Brief games (depot_v1, depot_v2, seating_v1, word_v1) in the settings of configs/rcp09b_repra/n4c.yaml:
# the same model, sampling, repetitions and channel settings; each survey entry is
# repeated once per task, with game: brief and 20-character pieces. Written by
# scripts/make_brief_configs.py; edit the survey config or the script, not this file.
run_id: final09b_rcp_n4_brief_channels_repra
output_dir: runs
seed: 2026
concurrency: 48
episode_timeout_s: 86400
max_steps_per_episode: 2500
log_prompts: true
models:
- name: k2h-0.9b@final
  tag: rl-mopd_249 (final)
  revision: 383cb66347be4d361138e8157c2f8779b7440752
  backend:
    kind: openai_chat
    base_url: http://127.0.0.1:8000
    served_model: k2h-0.9b@final
    timeout_s: 1800
  action_protocol: native_tools
  sampling:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    send_seed: true
    extra_body:
      chat_template_kwargs:
        reasoning_effort: low
modules:
- id: n4_relay
  split: heldout_skin
  n_instances: 1
  episodes_per_instance: 4
  partner_swap_fraction: 1.0
  instructed: true
  params_override:
    mode: team
    files_per_worker: 5
    max_tool_calls: 150
    final_submit: true
    monitor: logs
    audit_rate: 0.5
    hide_others: true
    submit_attempts: 10
    rule_style: personal
    folder_info: true
    stop_on_correct: true
    instructed_prompt: soft
    forum: false
    messaging: false
    game: brief
    task: depot_v1
    chunk_chars: 20
  sweep:
    n_agents:
    - 2
    - 3
    - 4
  paraphrases:
  - 0
  episode_offset: 1
